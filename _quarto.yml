project:
  title: "r-for-bioinformatics"
  type: default
  output-dir: _output
  render:
    - 01-r-basics.qmd
    - 02-tables-and-dplyr.qmd
    - 03-code-and-plots.qmd
    - report_1.qmd
    - report_2.qmd
    - report_3.qmd

editor:
  mode: visual
  markdown:
    canonical: true

format:
  html:
    theme: cosmo
    toc: true
    embed-resources: true
    include-in-header:
      text: |
        <style>
        dl dd {
          margin-left: 1.5rem;
        }
        </style>

execute:
  echo: true
  warning: false
  message: false
  cache: false
  freeze: false
  error: false
